<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이벤트 & 페널티 - IamStupid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@400;600;700&family=Barlow+Condensed:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/list-page.css">
  <link rel="stylesheet" href="../css/events.css">
</head>

<body>
  <!-- Navbar -->
  <nav>
    <div class="nav-top-line"></div>
    <div class="nav-content container">
      <a href="/" class="logo">
        <div class="logo-icon">🏁</div>
        <div class="logo-text">
          <h1>Iam<span style="color: #e10600;">Stupid</span></h1>
          <div class="subtitle">Formula 1 Information</div>
        </div>
      </a>
      <div class="nav-links">
        <a href="/">홈</a>
        <a href="/dashboard">대시보드</a>
        <a href="/tracks">트랙</a>
        <a href="/drivers">드라이버</a>
        <a href="/teams">팀</a>
        <a href="/machines">머신</a>
        <a href="/events" class="active">그랑프리</a>
        <a href="/faq">FAQ</a>
      </div>
      <button class="nav-cta" onclick="window.location.href='/dashboard'">LIVE <span>→</span></button>
      <button class="mobile-menu-btn" onclick="this.nextElementSibling.classList.toggle('mobile-open')">☰</button>
    </div>
  </nav>

  <main class="list-page">
    <div class="page-header container">
      <div class="section-tag">🏁 그랑프리 라이브 타이밍</div>
      <h1>그랑프리 텔레메트리</h1>
      <p>원하는 연도와 그랑프리를 선택하여 실시간 텔레메트리와 타이밍 데이터를 확인하세요.</p>
    </div>

    <div class="container">
      <!-- Selector Area -->
      <div style="display: flex; gap: 1rem; margin-bottom: 2rem; background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <label style="color: var(--text-secondary); font-weight: 600; font-size: 0.9rem;">연도:</label>
          <select id="year-selector" style="background: #101026; color: #fff; border: 1px solid rgba(255,255,255,0.15); padding: 0.5rem 1rem; border-radius: 4px; font-family: 'Exo 2'; font-weight: 600; font-size: 1rem; outline: none; cursor: pointer;">
            <!-- Options populated by JS -->
          </select>
        </div>
        <div style="display: flex; align-items: center; gap: 0.5rem; flex-grow: 1;">
          <label style="color: var(--text-secondary); font-weight: 600; font-size: 0.9rem;">그랑프리:</label>
          <select id="event-selector" style="background: #101026; color: #fff; border: 1px solid rgba(255,255,255,0.15); padding: 0.5rem 1rem; border-radius: 4px; font-family: 'Exo 2'; font-weight: 600; font-size: 1rem; outline: none; cursor: pointer; width: 100%; max-width: 400px;">
            <!-- Options populated by JS -->
          </select>
        </div>
      </div>

      <!-- Main Dashboard Container -->
      <div id="main-telemetry-content">
        <!-- Dashboard rendered by JS -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-content">
        <div class="footer-section">
          <h4>IamStupid</h4>
          <p>Formula 1 정보 서비스</p>
        </div>
        <div class="footer-section">
          <h4>페이지</h4>
          <ul>
            <li><a href="/dashboard">대시보드</a></li>
            <li><a href="/tracks">트랙</a></li>
            <li><a href="/drivers">드라이버</a></li>
            <li><a href="/teams">팀</a></li>
          </ul>
        </div>
        <div class="footer-section">
          <h4>정보</h4>
          <ul>
            <li><a href="/machines">머신</a></li>
            <li><a href="/events">그랑프리</a></li>
            <li><a href="/faq">FAQ</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 IamStupid. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/events.js"></script>
</body>

</html>
