<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이벤트 & 페널티 - IamStupid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@400;600;700&family=Barlow+Condensed:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/list-page.css">
  <link rel="stylesheet" href="../css/events.css">
</head>

<body>
  <!-- Navbar -->
  <nav>
    <div class="nav-top-line"></div>
    <div class="nav-content container">
      <a href="/" class="logo">
        <div class="logo-icon">🏁</div>
        <div class="logo-text">
          <h1>Iam<span style="color: #e10600;">Stupid</span></h1>
          <div class="subtitle">Formula 1 Information</div>
        </div>
      </a>
      <div class="nav-links">
        <a href="/">홈</a>
        <a href="/dashboard">대시보드</a>
        <a href="/tracks">트랙</a>
        <a href="/drivers">드라이버</a>
        <a href="/teams">팀</a>
        <a href="/machines">머신</a>
        <a href="/events" class="active">그랑프리</a>
        <a href="/faq">FAQ</a>
      </div>
      <button class="nav-cta" onclick="window.location.href='/dashboard'">LIVE <span>→</span></button>
      <button class="mobile-menu-btn" onclick="this.nextElementSibling.classList.toggle('mobile-open')">☰</button>
    </div>
  </nav>

  <main class="list-page">
    <div class="page-header container">
      <div class="section-tag">📅 2026 시즌</div>
      <h1>그랑프리 일정</h1>
      <p>금년 Formula 1 시즌의 전체 그랑프리 일정과 개최 정보를 한눈에 확인하세요.</p>
    </div>

    <div class="container">
      <div id="events-timeline" class="events-timeline"></div>
    </div>
  </main>

  <!-- Telemetry Simulation Modal -->
  <div id="telemetry-modal" class="modal">
    <div class="modal-content" style="max-width: 950px; width: 95%;">
      <button class="modal-close" onclick="toggleModal('telemetry-modal', false)">✕</button>
      <div class="modal-header" style="border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 0.75rem;">
        <h2 id="modal-gp-name" style="font-family: 'Orbitron', sans-serif; font-weight: 900; color: #fff; margin: 0; font-size: 1.5rem; letter-spacing: 0.05em;"></h2>
        <p id="modal-gp-info" style="margin: 0.25rem 0 0; color: var(--text-secondary); font-size: 0.875rem; font-weight: 500; display: flex; align-items: center; gap: 0.5rem;"></p>
      </div>
      <div class="modal-body" style="padding-top: 1rem;">
        <div id="modal-telemetry-content"></div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-content">
        <div class="footer-section">
          <h4>IamStupid</h4>
          <p>Formula 1 정보 서비스</p>
        </div>
        <div class="footer-section">
          <h4>페이지</h4>
          <ul>
            <li><a href="/dashboard">대시보드</a></li>
            <li><a href="/tracks">트랙</a></li>
            <li><a href="/drivers">드라이버</a></li>
            <li><a href="/teams">팀</a></li>
          </ul>
        </div>
        <div class="footer-section">
          <h4>정보</h4>
          <ul>
            <li><a href="/machines">머신</a></li>
            <li><a href="/events">그랑프리</a></li>
            <li><a href="/faq">FAQ</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 IamStupid. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/events.js"></script>
</body>

</html>
