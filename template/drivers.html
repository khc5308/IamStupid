<body>
  <!-- Navbar -->
  <nav>
    <div class="nav-top-line"></div>

      <a href="/" class="logo">
        <div class="logo-icon">🏁</div>
        <div class="logo-text">
          <h1>Iam<span style="color: #e10600;">Stupid</span></h1>
          <div class="subtitle">Formula 1 Information</div>
        </div>
      </a>
      <div class="nav-links">
        <a href="/">홈</a>
        <a href="/dashboard">대시보드</a>
        <a href="/tracks">트랙</a>

        <a href="/teams">팀</a>
        <a href="/events">이벤트</a>
        <a href="/faq.html">FAQ</a>

      <button class="mobile-menu-btn" onclick="this.nextElementSibling.classList.toggle('mobile-open')">☰</button>
    </div>
  </nav>

  <main class="list-page">
    <div class="page-header container">
      <div class="section-tag">👤 2025 시즌</div>
      <h1>드라이버</h1>
      <p>2025 Formula 1 시즌의 20명 드라이버. 각 드라이버의 프로필, 스탯, 팀 정보를 확인하세요.</p>
    </div>

    <div class="container">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="driver-search" placeholder="드라이버 검색...">
      </div>

      <div id="drivers-grid" class="grid grid-3"></div>
    </div>
  </main>

  <!-- Driver Modal -->
  <div id="driver-modal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="toggleModal('driver-modal', false)">✕</button>
      <div class="modal-header">
        <h2 id="modal-driver-name"></h2>
        <p id="modal-driver-team" style="margin: 0; color: var(--text-secondary); font-size: 0.875rem;"></p>
      </div>
      <div class="modal-body">
        <div id="modal-driver-content"></div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-content">
        <div class="footer-section">
          <h4>IamStupid</h4>
